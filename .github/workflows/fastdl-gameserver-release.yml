name: FastDL Release Asset

on:
  release:
    types: [published]

jobs:
  fastdl_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install bzip2 and zip utilities
        run: sudo apt-get update && sudo apt-get install -y bzip2 zip

      - name: Check required directories exist
        run: |
          for dir in addons materials models; do
            if [ ! -d "$dir" ]; then
              echo "Required directory '$dir' does not exist!"
              exit 1
            fi
          done

      - name: Clean Build Directory
        run: rm -rf fastdl-build && mkdir -p fastdl-build

      - name: Bzip2 models and materials recursively
        run: |
          # Copy folder structure and bz2 the files.
          for dir in models materials; do
            if [ -d "$dir" ]; then
              find "$dir" -type f | while read file; do
                dest="fastdl-build/$file.bz2"
                mkdir -p "$(dirname "$dest")"
                bzip2 -c "$file" > "$dest"
              done
            fi
          done

      - name: Archive bz2 files
        run: |
          cd fastdl-build
          zip -r "../FastDL-Files-${{ github.event.release.tag_name }}.zip" *

      # --- New step: Archive all GameServer files ---
      - name: Create GameServer-Files zip (addons, materials, models)
        run: |
          zip -r "GameServer-Files-${{ github.event.release.tag_name }}.zip" addons materials models

      - name: Upload FastDL zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastDL-Files-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GameServer-Files zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: GameServer-Files-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}